version: '3'

tasks:
  dev:
    aliases:
      - dev
    desc: 'run Love Signal API app with local config'
    cmds:
      - go run ./cmd/love-signal-api/main.go --config=./config/local.yaml

  swagger:
    aliases:
      - swagger
    desc: 'create swagger doc'
    cmds:
      - swag init --pd -g cmd/love-signal-api/main.go -ot "go,json" -p "camelcase"